name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  COOKIE_SECURE: "false"
  SESSION_TTL_HOURS: "8"
  IMAGE: auction-service:${{ github.sha }}
jobs:
  checks:
    name: check-${{ matrix.stage }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [policy, style, tests, migrations, backup, security, dependencies, secrets]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            requirements*.lock
      - name: Isolate database
        run: echo "DATABASE_PATH=$RUNNER_TEMP/auction-${{ matrix.stage }}.db" >> "$GITHUB_ENV"
      - run: make setup
      - name: Run the same Make targets as locally
        env:
          STAGE: ${{ matrix.stage }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mkdir -p reports
          set -o pipefail
          case "$STAGE" in
            policy) make policy-check ;;
            style) .venv/bin/python -m pip check && make quality ;;
            tests) make test && make mutation-check ;;
            migrations) make migration-check ;;
            backup) make backup-check && make backup-demo ;;
            security) make security ;;
            dependencies) make dependencies-check ;;
            secrets) make secrets-check ;;
            *) exit 2 ;;
          esac 2>&1 | tee "reports/$STAGE.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-${{ matrix.stage }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
  build:
    name: build
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: make container-build
      - name: Export the image once
        run: |
          mkdir -p dist
          docker save "$IMAGE" -o dist/image.tar
          sha256sum dist/image.tar > dist/image.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-image-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 3
  container:
    name: container-${{ matrix.stage }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stage: [smoke, scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-image-candidate
          path: dist/
      - run: sha256sum -c dist/image.sha256 && docker load -i dist/image.tar
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: matrix.stage == 'scan'
        with:
          path: .cache/trivy
          key: trivy-${{ runner.os }}-${{ hashFiles('.ci/tools.env') }}-${{ github.run_id }}
          restore-keys: trivy-${{ runner.os }}-${{ hashFiles('.ci/tools.env') }}-
      - name: Verify image
        env:
          STAGE: ${{ matrix.stage }}
        run: |
          mkdir -p reports
          set -o pipefail
          if [ "$STAGE" = smoke ]; then
            make container-check 2>&1 | tee reports/container-check.log
          else
            make container-scan 2>&1 | tee reports/container-scan.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-container-${{ matrix.stage }}-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
  delivery:
    name: delivery-check
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-image-candidate
          path: dist/
      - run: sha256sum -c dist/image.sha256 && docker load -i dist/image.tar
      - run: make delivery-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reports-delivery-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: ci-gate
    if: always()
    needs: [checks, build, container, delivery]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed on failed, cancelled or skipped prerequisites
        env:
          CHECKS: ${{ needs.checks.result }}
          BUILD: ${{ needs.build.result }}
          CONTAINER: ${{ needs.container.result }}
          DELIVERY: ${{ needs.delivery.result }}
        run: |
          test "$CHECKS" = success
          test "$BUILD" = success
          test "$CONTAINER" = success
          test "$DELIVERY" = success
  publish:
    name: publish
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-image-candidate
          path: dist/
      - name: Publish exactly the tested image, without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum -c dist/image.sha256
          docker load -i dist/image.tar
          DESTINATION="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          docker tag "$IMAGE" "$DESTINATION"
          docker push "$DESTINATION"
          echo "Published: $DESTINATION" >> "$GITHUB_STEP_SUMMARY"
