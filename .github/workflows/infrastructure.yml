name: Infrastructure
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: infrastructure-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: infra-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: infra/requirements.lock
      - name: Install pinned infrastructure tools
        run: python -m pip install -r infra/requirements.lock
      - name: Check syntax and infrastructure rules
        run: make infra-check
      - name: Install virtual machine tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
      - name: Check failed guest startup handling
        run: python -m unittest discover -s infra/tests -p 'test_*.py'
      - name: Enable hardware virtualization for the current runner
        run: |
          if [ -e /dev/kvm ]; then
            runner_group="$(id -gn)"
            # Keep access if udev recreates the device after the first guest starts.
            printf 'KERNEL=="kvm", GROUP:="%s", MODE:="0660", OPTIONS+="static_node=kvm"\n' "$runner_group" |
              sudo tee /etc/udev/rules.d/99-auction-kvm.rules >/dev/null
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=10
            sudo chgrp "$runner_group" /dev/kvm
            sudo chmod 0660 /dev/kvm
          fi
      - name: Configure two disposable Debian hosts and repair drift
        run: python infra/tests/rehearsal.py
      - name: Save verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infrastructure-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/infra/
          if-no-files-found: error
          retention-days: 14
