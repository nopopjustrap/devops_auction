---
# Only references are stored here. Values stay on the controller with mode 0600.
secrets_directory: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/auction-lab"
operator_password: >-
  {{ lookup('ansible.builtin.password',
     secrets_directory ~ '/' ~ environment_name ~ '-operator.password',
     length=32, chars=['ascii_letters', 'digits']) }}
