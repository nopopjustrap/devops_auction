[defaults]
inventory = inventories/lab/hosts.yml
remote_user = auction-admin
private_key_file = ~/.ssh/auction_infra
host_key_checking = True
interpreter_python = /usr/bin/python3
retry_files_enabled = False
forks = 2
timeout = 30

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
pipelining = True
retries = 3
